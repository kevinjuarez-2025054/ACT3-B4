usuario-detalle.component.html
<div>
 
    <h2>
        Detalle del usuario
</h2>
 
    <p>
<strong>ID:</strong>
        {{ usuario.id }}
</p>
 
    <p>
<strong>Nombre:</strong>
        {{ usuario.nombre }}
</p>
 
    <p>
<strong>Email:</strong>
        {{ usuario.email }}
</p>
 
    <p>
<strong>Rol:</strong>
        {{ usuario.rol }}
</p>
 
    <button
        (click)="cerrarVentana()"
>
 
        Cerrar
 
    </button>
 
</div>
